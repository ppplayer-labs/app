name: ppplayer
title: PPPlayer
base: core24
version: '4.0.2'
summary: Media player powered by Lucas Veneno
description: |
  PPPlayer is a modern Flutter media player for music discovery,
  local music and video libraries, network streams, and playlists.

license: MIT
website: https://ppplayer.com
issues: https://github.com/ppplayer-labs/app/issues
source-code: https://github.com/ppplayer-labs/app
contact: https://ppplayer.com/support
icon: snap/gui/icon.png

grade: stable
confinement: strict

platforms:
  amd64:

apps:
  ppplayer:
    command: ppplayer
    extensions: [gnome]
    plugs:
      - network
      - network-bind
      - audio-playback
      - home
      - removable-media
      - opengl
      - x11
      - wayland
    environment:
      LD_LIBRARY_PATH: "$SNAP/lib:$SNAP/usr/lib/$SNAPCRAFT_ARCH_TRIPLET:$LD_LIBRARY_PATH"

parts:
  bundle:
    plugin: dump
    source: build/linux/x64/release/bundle
    stage-packages:
      - libmpv2
      - libsecret-1-0
      - libvulkan1
      - libepoxy0
