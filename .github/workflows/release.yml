name: PPPlayer Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      publish_github_release:
        description: "Approve creating a public GitHub Release for this exact commit/version"
        type: boolean
        required: true
        default: false
      publish_snap_store:
        description: "Approve publishing the built Snap package to the Snap Store stable channel"
        type: boolean
        required: true
        default: false
      expected_version:
        description: "Required tag guard when publishing (e.g. v4.0.2); must match pubspec.yaml"
        type: string
        required: false
        default: ""
      expected_sha:
        description: "Required 40-char commit SHA guard when publishing; must match HEAD"
        type: string
        required: false
        default: ""

permissions:
  contents: read

jobs:
  validate-and-test:
    name: Validate Version & Run Tests
    runs-on: ubuntu-latest
    outputs:
      is_new_version: ${{ steps.version_check.outputs.is_new_version }}
      should_build: ${{ steps.version_check.outputs.should_build }}
      version: ${{ steps.version_check.outputs.version }}
      source_sha: ${{ steps.version_check.outputs.source_sha }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Check for New Version
        id: version_check
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //g' | tr -d ' ' | tr -d '\r' | awk -F'+' '{print $1}')
          TAG="v$VERSION"
          SOURCE_SHA=$(git rev-parse HEAD)
          echo "version=$TAG" >> "$GITHUB_OUTPUT"
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"

          if git ls-remote --tags origin | grep -q "refs/tags/$TAG$"; then
            echo "Release tag $TAG already exists on origin."
            echo "is_new_version=false" >> "$GITHUB_OUTPUT"
            IS_NEW=false
          else
            echo "New version detected: $TAG."
            echo "is_new_version=true" >> "$GITHUB_OUTPUT"
            IS_NEW=true
          fi

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual dispatch triggered. Proceeding with build verification."
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          elif [ "$IS_NEW" = "true" ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Check Formatting
        run: |
          # Preserve the app's established formatting through the SDK upgrade.
          if ! git ls-files -z -- ':(glob)lib/**/*.dart' ':(glob)test/**/*.dart' ':(glob)integration_test/**/*.dart' ':!:lib/core/playback/packages/**' ':!:**/*.g.dart' ':!:**/*.freezed.dart' | xargs -0 dart format --language-version=3.8 --output=none --set-exit-if-changed; then
            echo "::error::Dart format check failed. Printing diff:"
            git ls-files -z -- ':(glob)lib/**/*.dart' ':(glob)test/**/*.dart' ':(glob)integration_test/**/*.dart' ':!:lib/core/playback/packages/**' ':!:**/*.g.dart' ':!:**/*.freezed.dart' | xargs -0 dart format --language-version=3.8
            git diff
            exit 1
          fi
          # Match the nested engine's pubspec SDK floor even when its own
          # generated package_config.json is absent in a fresh checkout.
          dart format --language-version=3.7 --output=none --set-exit-if-changed lib/core/playback/packages/pp_playback_engine/lib lib/core/playback/packages/pp_playback_engine/test

      - name: Analyze
        run: flutter analyze

      - name: Run Tests
        run: flutter test test lib/core/playback/packages/pp_playback_engine/test third_party/chromium/packages/flutter_chromium_webview/test third_party/chromium/packages/flutter_chromium_webview_platform_interface/test

      - name: Verify Candidate and Packaging Guards
        run: |
          python3 scripts/verify_chromium_snapshot.py
          python3 -m unittest discover -s scripts -p 'test_*.py'



  build-android:
    name: Build Android App
    needs: validate-and-test
    if: needs.validate-and-test.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Configure Keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
             echo "::error::Android signing secrets are missing. Strict signing requires ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD."
             exit 1
          fi
          
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/keystore.jks
          
          cat << EOF > android/key.properties
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=keystore.jks
          EOF

      - name: Build Release APK & App Bundle
        run: |
          flutter build apk --release
          flutter build appbundle --release


      - name: Verify APK Signature
        run: |
          BUILD_TOOLS_DIR=$(ls -d $ANDROID_SDK_ROOT/build-tools/* | tail -1)
          $BUILD_TOOLS_DIR/apksigner verify --print-certs build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PPPlayer-Android
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Upload App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: PPPlayer-Android-AAB
          path: build/app/outputs/bundle/release/app-release.aab

  build-macos:
    name: Build macOS App
    needs: validate-and-test
    if: needs.validate-and-test.outputs.should_build == 'true'
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify native Flutter Quit handshake
        run: python3 -m unittest discover -s scripts -p 'test_macos_quit_handshake.py'

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: |
          mkdir -p build/ios/SourcePackages/
          flutter pub get

      - name: Import macOS Certificate
        env:
          MACOS_CERTIFICATE_B64: ${{ secrets.MACOS_CERTIFICATE_B64 }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
        run: |
          if [ -z "$MACOS_CERTIFICATE_B64" ] || [ -z "$MACOS_CERTIFICATE_PWD" ]; then
             echo "::error::macOS signing certificate secrets are missing. Strict signing requires MACOS_CERTIFICATE_B64 and MACOS_CERTIFICATE_PWD."
             exit 1
          fi
          
          CERT_PATH=$RUNNER_TEMP/build_certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          echo -n "$MACOS_CERTIFICATE_B64" | base64 --decode -o $CERT_PATH
          
          security create-keychain -p "" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "" $KEYCHAIN_PATH

          security import $CERT_PATH -P "$MACOS_CERTIFICATE_PWD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: -k "" $KEYCHAIN_PATH
          
          # Set as default to ensure codesign picks it up
          security list-keychains -d user -s $KEYCHAIN_PATH $(security list-keychains -d user | tr -d '"')

      - name: Configure Xcode for Distribution Signing
        run: |
          sed -i '' 's/CODE_SIGN_IDENTITY = "Apple Development";/CODE_SIGN_IDENTITY = "Developer ID Application";/g' macos/Runner.xcodeproj/project.pbxproj
          sed -i '' 's/"CODE_SIGN_IDENTITY\[sdk=macosx\*\]" = "Apple Development";/"CODE_SIGN_IDENTITY[sdk=macosx*]" = "Developer ID Application";/g' macos/Runner.xcodeproj/project.pbxproj
          sed -i '' 's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/g' macos/Runner.xcodeproj/project.pbxproj

      - name: Build Release macOS
        run: flutter build macos --release

      - name: Verify Advertised Architectures
        working-directory: build/macos/Build/Products/Release
        run: |
          # Verify architectures (expecting arm64 and x86_64, or just one based on build settings)
          lipo -info PPPlayer.app/Contents/MacOS/PPPlayer
          codesign -dv --verbose=4 PPPlayer.app

      - name: Package DMG & Notarize
        working-directory: build/macos/Build/Products/Release
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APP_SPECIFIC_PASSWORD: ${{ secrets.APP_SPECIFIC_PASSWORD }}
          TEAM_ID: ${{ secrets.TEAM_ID }}
        run: |
          if [ -z "$APPLE_ID" ] || [ -z "$APP_SPECIFIC_PASSWORD" ] || [ -z "$TEAM_ID" ]; then
             echo "::error::Notarization secrets missing. Strict signing requires APPLE_ID, APP_SPECIFIC_PASSWORD, and TEAM_ID."
             exit 1
          fi
          
          # Find the exact signing identity
          IDENTITY=$(security find-identity -v -p codesigning | grep "Developer ID Application" | awk '{print $2}')
          
          if [ -z "$IDENTITY" ]; then
             echo "::error::Developer ID Application certificate not found in keychain!"
             exit 1
          fi
          
          echo "Deep signing the App with Hardened Runtime and Secure Timestamp..."
          # Nested CEF code is signed inside-out by embed_cef.py during build.
          # Sign only the final app here; --deep must not replace helper entitlements.
          codesign --force --options runtime --timestamp --entitlements ../../../../../macos/Runner/Release.entitlements --sign "$IDENTITY" PPPlayer.app
          codesign --verify --deep --strict --verbose=2 PPPlayer.app

          # Notarize and staple the app before producing either final container.
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent PPPlayer.app "$RUNNER_TEMP/PPPlayer-notarization.zip"
          xcrun notarytool submit "$RUNNER_TEMP/PPPlayer-notarization.zip" \
            --apple-id "$APPLE_ID" \
            --password "$APP_SPECIFIC_PASSWORD" \
            --team-id "$TEAM_ID" \
            --wait
          xcrun stapler staple PPPlayer.app
          xcrun stapler validate PPPlayer.app
          spctl -a -t exec PPPlayer.app

          # Both final ZIP and DMG are made from this same stapled app.
          # Create DMG
          npm install -g create-dmg
          create-dmg PPPlayer.app || true # Fallback if create-dmg fails on CI runner due to styling issues
          mv *.dmg PPPlayer-macOS.dmg || { echo "DMG creation failed"; exit 1; }
          
          echo "Signing the DMG..."
          codesign --force --timestamp --sign "$IDENTITY" PPPlayer-macOS.dmg
          
          echo "Submitting DMG for notarization..."
          xcrun notarytool submit PPPlayer-macOS.dmg \
            --apple-id "$APPLE_ID" \
            --password "$APP_SPECIFIC_PASSWORD" \
            --team-id "$TEAM_ID" \
            --wait
            
          echo "Stapling notarization ticket to DMG..."
          xcrun stapler staple PPPlayer-macOS.dmg
          
          echo "Verifying DMG notarization..."
          spctl -a -t open --context context:primary-signature PPPlayer-macOS.dmg

      - name: Package App (ZIP)
        working-directory: build/macos/Build/Products/Release
        run: |
          # Zip preserving bundle permissions and symlinks
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent PPPlayer.app PPPlayer-macOS.zip

      - name: Upload macOS Zip
        uses: actions/upload-artifact@v4
        with:
          name: PPPlayer-macOS-zip
          path: build/macos/Build/Products/Release/PPPlayer-macOS.zip

      - name: Upload macOS DMG
        uses: actions/upload-artifact@v4
        with:
          name: PPPlayer-macOS-dmg
          path: build/macos/Build/Products/Release/PPPlayer-macOS.dmg

  build-windows:
    name: Build Windows App
    needs: validate-and-test
    if: needs.validate-and-test.outputs.should_build == 'true'
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Windows App
        run: flutter build windows --release

      - name: Create MSIX Package
        run: dart run msix:create

      - name: Upload Windows MSIX
        uses: actions/upload-artifact@v4
        with:
          name: PPPlayer-Windows-MSIX
          path: build/windows/x64/runner/Release/*.msix

  build-linux:
    name: Build Linux App
    needs: validate-and-test
    if: needs.validate-and-test.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libgl1-mesa-dev libegl1-mesa-dev libx11-dev libxcb1-dev libstdc++-11-dev libvulkan-dev libsecret-1-dev libjsoncpp-dev libmpv-dev libepoxy-dev patchelf file

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: 'stable'
          cache: true

      - name: Build Linux Packages
        run: |
          chmod +x packaging/linux/scripts/build_linux.sh
          ./packaging/linux/scripts/build_linux.sh

      - name: Validate Checksums & Tarball Metadata
        run: |
          cd dist
          sha256sum -c SHA256SUMS
          tar -tzf PPPlayer-Linux-x86_64.tar.gz | grep -q "^PPPlayer/ppplayer$"
          tar -tzf PPPlayer-Linux-x86_64.tar.gz | grep -q "^PPPlayer/ppplayer-portable$"
          tar -tzf PPPlayer-Linux-x86_64.tar.gz | grep -q "^PPPlayer/lib/libcef.so$"
          tar -tzf PPPlayer-Linux-x86_64.tar.gz | grep -q "^PPPlayer/lib/libmpv.so.2$"
          tar -tzf PPPlayer-Linux-x86_64.tar.gz | grep -q "^PPPlayer/lib/flutter_chromium_webview_subprocess$"
          tar -tzf PPPlayer-Linux-x86_64.tar.gz | grep -q "^PPPlayer/share/licenses/bundled/THIRD_PARTY_LICENSES.txt$"
          tar -tzf PPPlayer-Linux-x86_64.tar.gz | grep -q "^PPPlayer/share/applications/com.ppplayer.PPPlayer.desktop$"
          tar -tzf PPPlayer-Linux-x86_64.tar.gz | grep -q "^PPPlayer/share/metainfo/com.ppplayer.PPPlayer.metainfo.xml$"
          tar -tzf PPPlayer-Linux-x86_64.tar.gz | grep -q "^PPPlayer/share/icons/hicolor/512x512/apps/com.ppplayer.PPPlayer.png$"
          test ! -f PPPlayer-Linux-x86_64.flatpak

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PPPlayer-Linux
          path: dist/

      - name: Build Snap Package
        uses: snapcore/action-build@v1
        id: snapcraft
        with:
          snapcraft-channel: stable

      - name: Upload Snap Package Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PPPlayer-Linux-Snap
          path: ${{ steps.snapcraft.outputs.snap }}

  publish-github-release:
    name: Publish GitHub Release
    needs: [validate-and-test, build-android, build-macos, build-windows, build-linux]
    if: github.event_name == 'workflow_dispatch' && inputs.publish_github_release == true && needs.validate-and-test.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write # Scope: only the GitHub Release job has write access to create releases
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify Source Commit, Version & Non-Duplicate Release
        env:
          EXPECTED_VERSION: ${{ inputs.expected_version }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          VALIDATED_VERSION: ${{ needs.validate-and-test.outputs.version }}
          VALIDATED_SHA: ${{ needs.validate-and-test.outputs.source_sha }}
          IS_NEW_VERSION: ${{ needs.validate-and-test.outputs.is_new_version }}
        run: |
          set -euo pipefail
          ACTUAL_VERSION="v$(grep '^version:' pubspec.yaml | sed 's/version: //g' | tr -d ' ' | tr -d '\r' | awk -F'+' '{print $1}')"
          ACTUAL_SHA="$(git rev-parse HEAD)"

          if [ -z "$EXPECTED_VERSION" ] || [ "$EXPECTED_VERSION" != "$VALIDATED_VERSION" ] || [ "$ACTUAL_VERSION" != "$VALIDATED_VERSION" ]; then
            echo "::error::Version guard failed (expected='$EXPECTED_VERSION', validated='$VALIDATED_VERSION', actual='$ACTUAL_VERSION')."
            exit 1
          fi
          if [ -z "$EXPECTED_SHA" ] || [ "$EXPECTED_SHA" != "$VALIDATED_SHA" ] || [ "$ACTUAL_SHA" != "$VALIDATED_SHA" ]; then
            echo "::error::Source SHA guard failed (expected='$EXPECTED_SHA', validated='$VALIDATED_SHA', actual='$ACTUAL_SHA')."
            exit 1
          fi
          if [ "$IS_NEW_VERSION" != "true" ] || git ls-remote --tags origin | grep -q "refs/tags/${VALIDATED_VERSION}$"; then
            echo "::error::Tag ${VALIDATED_VERSION} already exists; refusing to overwrite or duplicate an existing public GitHub Release."
            exit 1
          fi
          echo "Verified GitHub Release target: ${VALIDATED_VERSION} at ${VALIDATED_SHA}"

      - name: Download Public GitHub Release Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: PPPlayer-*

      - name: Check Artifacts Existence
        id: check_artifacts
        run: |
          set -euo pipefail
          ls -R artifacts/

          if [ ! -f "artifacts/PPPlayer-Android/app-release.apk" ]; then
             echo "::error::Android APK artifact is missing!"
             exit 1
          fi

          if [ ! -f "artifacts/PPPlayer-Android-AAB/app-release.aab" ]; then
             echo "::error::Android AAB artifact is missing!"
             exit 1
          fi

          if [ ! -f "artifacts/PPPlayer-macOS-zip/PPPlayer-macOS.zip" ]; then
             echo "::error::macOS ZIP artifact is missing!"
             exit 1
          fi

          if [ ! -f "artifacts/PPPlayer-macOS-dmg/PPPlayer-macOS.dmg" ]; then
             echo "::error::macOS DMG artifact is missing!"
             exit 1
          fi

          if [ ! -f "artifacts/PPPlayer-Linux/PPPlayer-Linux-x86_64.AppImage" ]; then
             echo "::error::Linux AppImage artifact is missing!"
             exit 1
          fi

          if [ ! -f "artifacts/PPPlayer-Linux/PPPlayer-Linux-x86_64.tar.gz" ]; then
             echo "::error::Linux tar.gz artifact is missing!"
             exit 1
          fi

          if ! ls artifacts/PPPlayer-Linux/ppplayer_*_amd64.deb >/dev/null 2>&1; then
             echo "::error::Linux DEB artifact is missing!"
             exit 1
          fi

          echo "Note: Store-targeted PPPlayer-Windows-MSIX is retained as a protected CI artifact for Microsoft Partner Center and excluded from public GitHub Release assets."

      - name: Prepare Assets & Checksums
        run: |
          set -euo pipefail
          mkdir -p release-assets
          cp artifacts/PPPlayer-Android/app-release.apk release-assets/PPPlayer-Android.apk
          cp artifacts/PPPlayer-Android-AAB/app-release.aab release-assets/PPPlayer-Android.aab
          cp artifacts/PPPlayer-macOS-zip/PPPlayer-macOS.zip release-assets/PPPlayer-macOS.zip
          cp artifacts/PPPlayer-macOS-dmg/PPPlayer-macOS.dmg release-assets/PPPlayer-macOS.dmg
          cp artifacts/PPPlayer-Linux/PPPlayer-Linux-x86_64.AppImage release-assets/
          cp artifacts/PPPlayer-Linux/PPPlayer-Linux-x86_64.tar.gz release-assets/
          cp artifacts/PPPlayer-Linux/ppplayer_*_amd64.deb release-assets/
          cp artifacts/PPPlayer-Linux/SHA256SUMS release-assets/SHA256SUMS

          # Fail closed if an unsigned Store-targeted MSIX ever enters public GitHub Release assets.
          if find release-assets -iname "*.msix" | grep -q .; then
            echo "::error::Unsigned Store-targeted MSIX packages must not be published in public GitHub Release assets."
            exit 1
          fi

          cd release-assets
          shasum -a 256 * > checksums.txt
          cat checksums.txt

      - name: Extract Release Notes from CHANGELOG.md
        id: extract_notes
        run: |
          TAG_NAME="${{ needs.validate-and-test.outputs.version }}"
          TAG_VERSION="${TAG_NAME#v}"
          BASE_VERSION=$(echo "$TAG_VERSION" | cut -d'-' -f1)

          awk -v ver="## [$BASE_VERSION]" '
            index($0, ver) == 1 { found=1; next }
            /^## \[/ && found { exit }
            found { print }
          ' CHANGELOG.md > extracted_notes.md

          cat extracted_notes.md

      - name: Determine Prerelease Flag
        id: prerelease_check
        run: |
          if [[ "${{ needs.validate-and-test.outputs.version }}" == *"-"* ]]; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
            echo "make_latest=false" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
            echo "make_latest=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.validate-and-test.outputs.version }}
          name: ${{ needs.validate-and-test.outputs.version }}
          body_path: extracted_notes.md
          prerelease: ${{ steps.prerelease_check.outputs.is_prerelease }}
          make_latest: ${{ steps.prerelease_check.outputs.make_latest }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release-assets/*

  publish-snap:
    name: Publish to Snap Store
    needs: [validate-and-test, build-linux]
    if: github.event_name == 'workflow_dispatch' && inputs.publish_snap_store == true && needs.validate-and-test.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify Snap Store Credentials, Source Commit & Version
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
          EXPECTED_VERSION: ${{ inputs.expected_version }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          VALIDATED_VERSION: ${{ needs.validate-and-test.outputs.version }}
          VALIDATED_SHA: ${{ needs.validate-and-test.outputs.source_sha }}
        run: |
          set -euo pipefail
          if [ -z "$SNAPCRAFT_STORE_CREDENTIALS" ]; then
            echo "::error::SNAPCRAFT_STORE_CREDENTIALS secret is missing; cannot publish requested Snap release."
            exit 1
          fi

          ACTUAL_VERSION="v$(grep '^version:' pubspec.yaml | sed 's/version: //g' | tr -d ' ' | tr -d '\r' | awk -F'+' '{print $1}')"
          SNAP_VERSION="v$(grep '^version:' snap/snapcraft.yaml | sed "s/version://g" | tr -d " '\"" | tr -d '\r')"
          ACTUAL_SHA="$(git rev-parse HEAD)"

          if [ -z "$EXPECTED_VERSION" ] || [ "$EXPECTED_VERSION" != "$VALIDATED_VERSION" ] || [ "$ACTUAL_VERSION" != "$VALIDATED_VERSION" ] || [ "$SNAP_VERSION" != "$VALIDATED_VERSION" ]; then
            echo "::error::Snap version guard failed (expected='$EXPECTED_VERSION', validated='$VALIDATED_VERSION', pubspec='$ACTUAL_VERSION', snapcraft='$SNAP_VERSION')."
            exit 1
          fi
          if [ -z "$EXPECTED_SHA" ] || [ "$EXPECTED_SHA" != "$VALIDATED_SHA" ] || [ "$ACTUAL_SHA" != "$VALIDATED_SHA" ]; then
            echo "::error::Snap source SHA guard failed (expected='$EXPECTED_SHA', validated='$VALIDATED_SHA', actual='$ACTUAL_SHA')."
            exit 1
          fi
          echo "Verified Snap Store publish target: ${VALIDATED_VERSION} at ${VALIDATED_SHA}"

      - name: Download Snap Artifact
        uses: actions/download-artifact@v4
        with:
          name: PPPlayer-Linux-Snap
          path: snap-artifact

      - name: Verify Snap Artifact Matches Version
        id: check_snap
        env:
          VALIDATED_VERSION: ${{ needs.validate-and-test.outputs.version }}
        run: |
          set -euo pipefail
          BASE_VERSION="${VALIDATED_VERSION#v}"
          SNAP_FILE=$(find snap-artifact -maxdepth 2 -name "ppplayer_${BASE_VERSION}_*.snap" | head -n 1)
          if [ -z "$SNAP_FILE" ] || [ ! -s "$SNAP_FILE" ]; then
            echo "::error::Expected non-empty Snap artifact matching ppplayer_${BASE_VERSION}_*.snap not found."
            ls -R snap-artifact/
            exit 1
          fi
          echo "snap_path=$SNAP_FILE" >> "$GITHUB_OUTPUT"
          ls -lh "$SNAP_FILE"
          sha256sum "$SNAP_FILE"

      - name: Publish to Snap Store
        uses: snapcore/action-publish@v1
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        with:
          snap: ${{ steps.check_snap.outputs.snap_path }}
          release: stable
